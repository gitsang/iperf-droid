org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# When building from a network share (NAS / SMB mount) the Kotlin compile daemon
# cannot reliably flush its incremental caches (file-to-id.tab etc.) and fails
# with "Could not flush incremental caches". Compiling in-process avoids the
# problem, and the build-speed difference is negligible.
kotlin.compiler.execution.strategy=in-process
