plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'top.c8g.iperf_droid'
    compileSdk 34

    defaultConfig {
        applicationId "top.c8g.iperf_droid"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // iperf3 ships as a native library so the installer unpacks it into nativeLibraryDir, the
    // only place Android 10+ allows the app to exec a bundled binary from. Keep it uncompressed
    // so it is mapped straight out of the APK instead of being copied.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    androidResources {
        noCompress 'so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.leanback:leanback:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    // Use the real org.json implementation in unit tests (the android.jar stubs do not work on the JVM)
    testImplementation 'org.json:json:20231013'
}
