plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'top.c8g.iperf_droid'
    compileSdk 34

    defaultConfig {
        applicationId "top.c8g.iperf_droid"
        minSdk 24
        targetSdk 34
        // Version scheme: semver 2.0.0.
        //   versionName is the human-facing semver, bumped per release as
        //     MAJOR - breaking change (e.g. the applicationId, or a config format the user must act on)
        //     MINOR - new functionality, backwards compatible (new screen, new option)
        //     PATCH - backwards compatible fixes only (bug fixes, wording, styling)
        //   versionCode is a separate integer that Android requires to increase on every upload;
        //   it is bumped by one per release and never reused.
        versionCode 3
        versionName "1.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // iperf3 ships as a native library so the installer unpacks it into nativeLibraryDir, the
    // only place Android 10+ allows the app to exec a bundled binary from.
    //
    // useLegacyPackaging must stay true: it sets android:extractNativeLibs="true", which makes the
    // installer copy the .so files onto the filesystem. With it false the libraries stay inside the
    // APK and nativeLibraryDir points at "base.apk!/lib/<abi>", a ZIP-internal path that is not a
    // real file, so the binary could never be opened or executed.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.leanback:leanback:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    // Use the real org.json implementation in unit tests (the android.jar stubs do not work on the JVM)
    testImplementation 'org.json:json:20231013'
}
